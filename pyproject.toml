[project]
name = "houndiq"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "psycopg[binary]>=3.3,<4",
    "requests>=2.32,<3",
]

[tool.uv]
python-downloads = "manual"

[tool.pytest.ini_options]
testpaths = ["tests/test_environment.py", "tests/unit"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"